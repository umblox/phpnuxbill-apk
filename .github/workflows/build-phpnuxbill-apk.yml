name: Build PHPNuxBill Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Pilih varian APK yang ingin di-build'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      publish_release:
        description: 'Publikasikan APK Release (Signed) ke GitHub Releases'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Tag rilis opsional (contoh: v3.1.0). Kosongkan untuk otomatis dari version.properties'
        required: false
        default: ''
        type: string
      gradle_version:
        description: 'Versi Gradle Builder'
        required: true
        default: '9.6.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_variant || 'release' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK (${{ inputs.build_variant || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sanitize ACS IDE Local Paths (Linux Runner Compatibility)
        run: |
          if [ -f "gradle.properties" ]; then
            sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties
            sed -i '/\/data\/data\/com\.acside/d' gradle.properties
            echo "==> Cleaned ACS IDE paths from gradle.properties:"
            cat gradle.properties
          fi
          if [ -f "local.properties" ] && grep -q "/data/data/com.acside" local.properties; then
            rm -f local.properties
            echo "==> Removed ACS IDE local.properties so runner uses ANDROID_HOME"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Generate Full Blue App Icons (Hapus Border Putih Otomatis)
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/values

          LOGO_FILE=""
          for candidate in "logo.png" "1000347237.png" "1000060058.png" "play_store_512.png" "app/src/main/res/drawable-nodpi/arneta_logo_full.png"; do
            if [ -f "$candidate" ]; then
              LOGO_FILE="$candidate"
              break
            fi
          done

          if [ -n "$LOGO_FILE" ]; then
            if ! command -v convert &> /dev/null; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi

            # 1. Standarisasi ukuran gambar sumber ke 512x512 terlebih dahulu
            convert "$LOGO_FILE" -resize 512x512\! PNG32:/tmp/source_512.png

            # 2. Ambil sampel warna biru dari area dalam (+80+80) agar tidak mengenai border putih luar
            RAW_HEX=$(convert /tmp/source_512.png -depth 8 -crop 1x1+80+80 txt:- | grep -oE '#[0-9A-Fa-f]{6}' | head -n 1)
            if [ -z "$RAW_HEX" ] || [ "$RAW_HEX" = "#FFFFFF" ] || [ "$RAW_HEX" = "#ffffff" ]; then
              BG_HEX="#0568FD"
            else
              BG_HEX="$RAW_HEX"
            fi
            echo "Menggunakan warna biru utama ikon: $BG_HEX"

            # 3. Potong bersih seluruh border putih & sudut lengkung luar (-shave 58x58) lalu jadikan Full-Bleed 512x512
            convert /tmp/source_512.png -shave 58x58 -resize 512x512\! PNG32:/tmp/clean_full_blue.png

            # Simpan untuk logo di dalam aplikasi (Login & Top Header)
            cp /tmp/clean_full_blue.png app/src/main/res/drawable-nodpi/arneta_logo_full.png

            # 4. Generate Layer Foreground Adaptive Icon (Full biru menyatu dengan background tanpa garis tepi)
            convert /tmp/clean_full_blue.png -resize 72x72 -background "$BG_HEX" -gravity center -extent 108x108 PNG32:app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
            convert /tmp/clean_full_blue.png -resize 108x108 -background "$BG_HEX" -gravity center -extent 162x162 PNG32:app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            convert /tmp/clean_full_blue.png -resize 144x144 -background "$BG_HEX" -gravity center -extent 216x216 PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            convert /tmp/clean_full_blue.png -resize 216x216 -background "$BG_HEX" -gravity center -extent 324x324 PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            convert /tmp/clean_full_blue.png -resize 288x288 -background "$BG_HEX" -gravity center -extent 432x432 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

            # 5. Generate Legacy Icon & Round Icon (Full biru dari ujung ke ujung)
            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              IFS=":" read -r dpi full <<< "$pair"
              convert /tmp/clean_full_blue.png -resize ${full}x${full}\! PNG32:app/src/main/res/mipmap-${dpi}/ic_launcher.png
              cp app/src/main/res/mipmap-${dpi}/ic_launcher.png app/src/main/res/mipmap-${dpi}/ic_launcher_round.png
            done

            # 6. Buat file warna background biru & XML Adaptive Icon
            cat << EOF > app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">${BG_HEX}</color>
          </resources>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

            if [ -f "app/src/main/AndroidManifest.xml" ]; then
              sed -i 's|@drawable/ic_arneta_shield|@mipmap/ic_launcher|g' app/src/main/AndroidManifest.xml
              sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
              if ! grep -q "android:roundIcon=" app/src/main/AndroidManifest.xml; then
                sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
              fi
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version || '9.6.0' }}

      - name: Decode Release Keystore (GitHub Secrets)
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'release' }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ "$BUILD_VARIANT" = "release" ] && [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/release.jks
            echo "SIGNING_STORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "==> Release keystore berhasil didekode ke app/release.jks"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "==> Keystore secret tidak disetel / mode debug; build berjalan tanpa signing release."
          fi

      - name: Build Selected APK Variant
        env:
          BUILD_VARIANT: ${{ inputs.build_variant || 'release' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p output-apk
          if [ "$BUILD_VARIANT" = "release" ]; then
            gradle :app:assembleRelease --stacktrace

            V_MAJOR=$(grep -E '^VERSION_MAJOR=' app/version.properties 2>/dev/null | cut -d'=' -f2 | tr -d '\r ' || echo "3")
            V_MINOR=$(grep -E '^VERSION_MINOR=' app/version.properties 2>/dev/null | cut -d'=' -f2 | tr -d '\r ' || echo "1")
            V_PATCH=$(grep -E '^VERSION_PATCH=' app/version.properties 2>/dev/null | cut -d'=' -f2 | tr -d '\r ' || echo "0")
            APP_VER="${V_MAJOR:-3}.${V_MINOR:-1}.${V_PATCH:-0}"
            echo "APP_VERSION=${APP_VER}" >> "$GITHUB_ENV"

            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              cp app/build/outputs/apk/release/app-release.apk "output-apk/PHPNuxBill-Mobile.apk"
              cp app/build/outputs/apk/release/app-release.apk "output-apk/PHPNuxBill-Mobile-v${APP_VER}-Release.apk"
              echo "IS_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              cp app/build/outputs/apk/release/app-release-unsigned.apk "output-apk/PHPNuxBill-Mobile-v${APP_VER}-Unsigned.apk"
              echo "IS_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            else
              echo "ERROR: APK release tidak ditemukan!"
              exit 1
            fi
          else
            gradle :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "output-apk/PHPNuxBill-Mobile-Debug.apk"
            echo "IS_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f app/release.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHPNuxBill-Mobile-${{ inputs.build_variant || 'release' }}-APK
          path: output-apk/*.apk
          retention-days: 14

      - name: Determine Release Tag
        if: >-
          env.IS_SIGNED_RELEASE == 'true' &&
          (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
            (github.event_name == 'workflow_dispatch' && (inputs.build_variant || 'release') == 'release' && inputs.publish_release == true)
          )
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${APP_VERSION}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Publish Signed APK to GitHub Releases
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "PHPNuxBill Mobile ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: |
            output-apk/PHPNuxBill-Mobile.apk
            output-apk/PHPNuxBill-Mobile-v*-Release.apk
