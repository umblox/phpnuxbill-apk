name: Build Codebase Snapshot (APK)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-snapshot-apk"
  cancel-in-progress: true

jobs:
  build_and_publish_snapshot:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate APK snapshot bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          OUT="public/snapshot_apk.txt"
          UPDATED_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "# PHPNuxBill Android APK - Full Codebase Snapshot"
            echo "# Repository : ${{ github.repository }}"
            echo "# Branch     : ${{ github.ref_name }}"
            echo "# Commit     : ${{ github.sha }}"
            echo "# Updated    : ${UPDATED_AT}"
            echo ""
            echo "## FILE TREE (.kt)"
            find app/src/main/java -type f -name "*.kt" | sort
            echo ""

            for cfg in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
              if [ -f "$cfg" ]; then
                printf "\n\n// ==========================================\n// FILE: %s\n// ==========================================\n\n" "$cfg"
                cat "$cfg"
              fi
            done

            find app/src/main/java -type f -name "*.kt" | sort | while IFS= read -r f; do
              printf "\n\n// ==========================================\n// FILE: %s\n// ==========================================\n\n" "$f"
              cat "$f"
            done
          } > "$OUT"

          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="utf-8" />
            <title>PHPNuxBill APK Snapshot</title>
          </head>
          <body style="font-family:sans-serif;padding:24px;">
            <h2>PHPNuxBill Android APK Snapshot</h2>
            <p>Commit: <code>${{ github.sha }}</code></p>
            <p>Updated: ${UPDATED_AT}</p>
            <p><a href="./snapshot_apk.txt">Buka snapshot_apk.txt</a></p>
          </body>
          </html>
          EOF

          ls -lh "$OUT"

      - name: Upload downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-apk-txt
          path: public/snapshot_apk.txt
          retention-days: 14

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
